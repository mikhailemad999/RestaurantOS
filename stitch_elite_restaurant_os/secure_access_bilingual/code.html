<!DOCTYPE html>

<html class="dark h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RestaurantOS - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;family=Cairo:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#574500",
                        "on-primary": "#3c2f00",
                        "inverse-surface": "#e5e2e1",
                        "on-secondary-fixed": "#002113",
                        "on-secondary-container": "#00311f",
                        "secondary-fixed": "#6ffbbe",
                        "surface-bright": "#393939",
                        "primary": "#f2ca50",
                        "error": "#ffb4ab",
                        "primary-container": "#d4af37",
                        "tertiary-fixed-dim": "#ffb2b7",
                        "outline": "#99907c",
                        "on-surface-variant": "#d0c5af",
                        "primary-fixed-dim": "#e9c349",
                        "on-primary-fixed": "#241a00",
                        "tertiary-fixed": "#ffdadb",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed-dim": "#4edea3",
                        "tertiary": "#ffbec1",
                        "on-tertiary": "#67001b",
                        "on-surface": "#e5e2e1",
                        "surface-container-high": "#2a2a2a",
                        "surface-container-low": "#1c1b1b",
                        "on-tertiary-fixed": "#40000d",
                        "on-tertiary-container": "#8e0029",
                        "surface-container-highest": "#353535",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "on-secondary": "#003824",
                        "secondary-container": "#00a572",
                        "on-primary-container": "#554300",
                        "surface": "#131313",
                        "on-secondary-fixed-variant": "#005236",
                        "surface-dim": "#131313",
                        "surface-tint": "#e9c349",
                        "tertiary-container": "#ff949c",
                        "secondary": "#4edea3",
                        "background": "#131313",
                        "surface-container": "#20201f",
                        "inverse-primary": "#735c00",
                        "inverse-on-surface": "#313030",
                        "surface-variant": "#353535",
                        "surface-container-lowest": "#0e0e0e",
                        "on-tertiary-fixed-variant": "#92002a",
                        "on-background": "#e5e2e1",
                        "outline-variant": "#4d4635",
                        "primary-fixed": "#ffe088"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "lg": "24px",
                        "unit": "4px",
                        "xl": "40px",
                        "margin-mobile": "16px",
                        "md": "16px",
                        "gutter": "16px",
                        "sm": "8px",
                        "margin-desktop": "32px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "title-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "data-pos": ["JetBrains Mono"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-caps": ["JetBrains Mono"],
                        "headline-lg": ["Inter"],
                        "display": ["Inter"],
                        "arabic": ["Cairo"]
                    },
                    "fontSize": {
                        "title-md": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "data-pos": ["18px", { "lineHeight": "1.0", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .pin-dot {
            transition: all 0.2s ease-in-out;
        }
        .pin-dot.filled {
            background-color: theme('colors.primary');
            border-color: theme('colors.primary');
            box-shadow: 0 0 10px theme('colors.primary-container');
        }
        
        [dir="rtl"] .rtl-flip {
            transform: scaleX(-1);
        }
        [dir="rtl"] {
            font-family: 'Cairo', sans-serif;
        }
        [dir="rtl"] .font-data-pos {
            font-family: 'JetBrains Mono', monospace; /* Keep digits monospaced */
        }
    </style>
</head>
<body class="bg-background text-on-background h-full flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container" dir="ltr" id="app-container">
<!-- Top Navigation (Simplified for Login) -->
<header class="flex justify-between items-center w-full px-gutter h-16 fixed top-0 z-50 bg-surface dark:bg-surface border-b border-outline-variant">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-2xl" data-weight="fill">restaurant</span>
<span class="text-title-md font-title-md text-primary dark:text-primary tracking-tight">RestaurantOS</span>
</div>
<div class="flex items-center gap-4">
<button class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors text-label-caps font-label-caps bg-surface-container py-2 px-4 rounded border border-outline-variant hover:border-primary" id="lang-toggle">
<span class="material-symbols-outlined text-lg">language</span>
<span id="lang-label">العربية</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center pt-16 px-gutter relative overflow-hidden">
<!-- Abstract Background Element -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at 50% 30%, theme('colors.surface-variant') 0%, transparent 60%);"></div>
<div class="z-10 w-full max-w-md bg-surface-container-low border border-outline-variant rounded-xl p-8 flex flex-col items-center gap-8 shadow-2xl">
<div class="text-center space-y-2 w-full">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-surface-container-highest border border-outline-variant mb-4">
<span class="material-symbols-outlined text-3xl text-primary">lock</span>
</div>
<h1 class="text-headline-lg font-headline-lg text-on-background m-0" id="title-text">Secure Access</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant m-0" id="subtitle-text">Enter PIN to unlock POS</p>
</div>
<!-- PIN Display -->
<div class="flex gap-4 justify-center items-center w-full my-4" id="pin-display">
<div class="w-4 h-4 rounded-full border-2 border-outline-variant pin-dot"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline-variant pin-dot"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline-variant pin-dot"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline-variant pin-dot"></div>
</div>
<!-- Error State (Hidden by default) -->
<div class="hidden w-full text-center py-2 px-4 bg-error-container text-on-error-container border border-error rounded text-body-sm font-body-sm flex items-center justify-center gap-2" id="error-message">
<span class="material-symbols-outlined text-error text-sm">warning</span>
<span id="error-text">Invalid PIN</span>
</div>
<!-- Numeric Keypad -->
<div class="grid grid-cols-3 gap-3 w-full" dir="ltr"> <!-- Keypad stays LTR always for layout consistency -->
<!-- Row 1 -->
<button class="keypad-btn h-16 bg-surface-container border border-outline-variant rounded text-data-pos font-data-pos text-on-surface hover:bg-surface-variant hover:border-primary transition-all active:scale-95 active:bg-primary-container active:text-on-primary-container" data-val="1">1</button>
<button class="keypad-btn h-16 bg-surface-container border border-outline-variant rounded text-data-pos font-data-pos text-on-surface hover:bg-surface-variant hover:border-primary transition-all active:scale-95 active:bg-primary-container active:text-on-primary-container" data-val="2">2</button>
<button class="keypad-btn h-16 bg-surface-container border border-outline-variant rounded text-data-pos font-data-pos text-on-surface hover:bg-surface-variant hover:border-primary transition-all active:scale-95 active:bg-primary-container active:text-on-primary-container" data-val="3">3</button>
<!-- Row 2 -->
<button class="keypad-btn h-16 bg-surface-container border border-outline-variant rounded text-data-pos font-data-pos text-on-surface hover:bg-surface-variant hover:border-primary transition-all active:scale-95 active:bg-primary-container active:text-on-primary-container" data-val="4">4</button>
<button class="keypad-btn h-16 bg-surface-container border border-outline-variant rounded text-data-pos font-data-pos text-on-surface hover:bg-surface-variant hover:border-primary transition-all active:scale-95 active:bg-primary-container active:text-on-primary-container" data-val="5">5</button>
<button class="keypad-btn h-16 bg-surface-container border border-outline-variant rounded text-data-pos font-data-pos text-on-surface hover:bg-surface-variant hover:border-primary transition-all active:scale-95 active:bg-primary-container active:text-on-primary-container" data-val="6">6</button>
<!-- Row 3 -->
<button class="keypad-btn h-16 bg-surface-container border border-outline-variant rounded text-data-pos font-data-pos text-on-surface hover:bg-surface-variant hover:border-primary transition-all active:scale-95 active:bg-primary-container active:text-on-primary-container" data-val="7">7</button>
<button class="keypad-btn h-16 bg-surface-container border border-outline-variant rounded text-data-pos font-data-pos text-on-surface hover:bg-surface-variant hover:border-primary transition-all active:scale-95 active:bg-primary-container active:text-on-primary-container" data-val="8">8</button>
<button class="keypad-btn h-16 bg-surface-container border border-outline-variant rounded text-data-pos font-data-pos text-on-surface hover:bg-surface-variant hover:border-primary transition-all active:scale-95 active:bg-primary-container active:text-on-primary-container" data-val="9">9</button>
<!-- Row 4 -->
<button class="h-16 bg-transparent text-on-surface-variant hover:text-on-surface flex items-center justify-center transition-colors rounded text-label-caps font-label-caps" id="forgot-btn">Forgot?</button>
<button class="keypad-btn h-16 bg-surface-container border border-outline-variant rounded text-data-pos font-data-pos text-on-surface hover:bg-surface-variant hover:border-primary transition-all active:scale-95 active:bg-primary-container active:text-on-primary-container" data-val="0">0</button>
<button class="h-16 bg-transparent text-on-surface-variant hover:text-on-surface flex items-center justify-center transition-colors rounded active:scale-95" id="delete-btn">
<span class="material-symbols-outlined rtl-flip text-2xl">backspace</span>
</button>
</div>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('app-container');
            const langToggleBtn = document.getElementById('lang-toggle');
            const langLabel = document.getElementById('lang-label');
            const titleText = document.getElementById('title-text');
            const subtitleText = document.getElementById('subtitle-text');
            const forgotBtn = document.getElementById('forgot-btn');
            const errorMsg = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const dots = document.querySelectorAll('.pin-dot');
            const keys = document.querySelectorAll('.keypad-btn');
            const deleteBtn = document.getElementById('delete-btn');

            let currentPin = '';
            const CORRECT_PIN = '1234';
            let currentLang = 'en';

            const translations = {
                en: {
                    title: 'Secure Access',
                    subtitle: 'Enter PIN to unlock POS',
                    forgot: 'Forgot?',
                    error: 'Invalid PIN',
                    toggleLabel: 'العربية'
                },
                ar: {
                    title: 'دخول آمن',
                    subtitle: 'أدخل رمز المرور لفتح النظام',
                    forgot: 'نسيت؟',
                    error: 'رمز غير صحيح',
                    toggleLabel: 'English'
                }
            };

            function updateUIForLanguage(lang) {
                const t = translations[lang];
                titleText.textContent = t.title;
                subtitleText.textContent = t.subtitle;
                forgotBtn.textContent = t.forgot;
                errorText.textContent = t.error;
                langLabel.textContent = t.toggleLabel;
                
                if (lang === 'ar') {
                    container.setAttribute('dir', 'rtl');
                    titleText.classList.replace('font-headline-lg', 'font-arabic');
                    titleText.classList.add('text-3xl', 'font-bold');
                    subtitleText.classList.replace('font-body-lg', 'font-arabic');
                    forgotBtn.classList.replace('font-label-caps', 'font-arabic');
                } else {
                    container.setAttribute('dir', 'ltr');
                    titleText.classList.replace('font-arabic', 'font-headline-lg');
                    titleText.classList.remove('text-3xl', 'font-bold');
                    subtitleText.classList.replace('font-arabic', 'font-body-lg');
                    forgotBtn.classList.replace('font-arabic', 'font-label-caps');
                }
            }

            langToggleBtn.addEventListener('click', () => {
                currentLang = currentLang === 'en' ? 'ar' : 'en';
                updateUIForLanguage(currentLang);
                resetPin();
            });

            function updateDots() {
                dots.forEach((dot, index) => {
                    if (index < currentPin.length) {
                        dot.classList.add('filled');
                    } else {
                        dot.classList.remove('filled');
                    }
                });
            }

            function resetPin() {
                currentPin = '';
                updateDots();
                errorMsg.classList.add('hidden');
            }

            function simulateLogin() {
                if (currentPin === CORRECT_PIN) {
                    // Success state
                    dots.forEach(dot => {
                        dot.style.backgroundColor = '#00a572'; // secondary-container
                        dot.style.borderColor = '#00a572';
                        dot.style.boxShadow = '0 0 15px #4edea3'; // secondary
                    });
                    setTimeout(() => {
                        alert(currentLang === 'en' ? 'Access Granted' : 'تم السماح بالدخول');
                        resetPin();
                        dots.forEach(dot => {
                            dot.style = ''; // reset styles
                        });
                    }, 500);
                } else {
                    // Error state
                    errorMsg.classList.remove('hidden');
                    const display = document.getElementById('pin-display');
                    display.animate([
                        { transform: 'translateX(0)' },
                        { transform: 'translateX(-5px)' },
                        { transform: 'translateX(5px)' },
                        { transform: 'translateX(0)' }
                    ], { duration: 300, iterations: 1 });
                    setTimeout(resetPin, 1000);
                }
            }

            keys.forEach(key => {
                key.addEventListener('click', () => {
                    if (currentPin.length < 4) {
                        currentPin += key.dataset.val;
                        updateDots();
                        errorMsg.classList.add('hidden');
                        if (currentPin.length === 4) {
                            setTimeout(simulateLogin, 200);
                        }
                    }
                });
            });

            deleteBtn.addEventListener('click', () => {
                if (currentPin.length > 0) {
                    currentPin = currentPin.slice(0, -1);
                    updateDots();
                    errorMsg.classList.add('hidden');
                }
            });
            
            // Initial render
            updateUIForLanguage('en');
        });
    </script>
</body></html>
