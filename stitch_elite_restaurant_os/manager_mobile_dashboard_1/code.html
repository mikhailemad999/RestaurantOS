<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Restaurant OS - Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {
            darkMode: "class",

                extend: {

                        "on-primary-fixed-variant": "#574500",
                        "outline-variant": "#4d4635",
                        "on-error": "#690005",
                        "on-tertiary": "#67001b",

                        "surface-dim": "#131313",
                        "surface-variant": "#353535",
                        "on-tertiary-fixed-variant": "#92002a",
                        "on-primary-container": "#554300",

                        "surface": "#131313",

                        "surface-tint": "#e9c349",
                        "inverse-primary": "#735c00",
                        "surface-bright": "#393939",
                        "on-secondary-container": "#00311f",
                        "inverse-on-surface": "#313030",
                        "surface-container-low": "#1c1b1b",
                        "primary-fixed": "#ffe088",
                        "tertiary-container": "#ff949c",
                        "background": "#131313",
                        "error": "#ffb4ab",
                        "on-primary": "#3c2f00",
                        "secondary-fixed": "#6ffbbe",
                        "secondary-container": "#00a572",
                        "on-tertiary-container": "#8e0029",

                        "tertiary": "#ffbec1",
                        "on-tertiary-fixed": "#40000d",
                        "on-secondary-fixed": "#002113",
                        "tertiary-fixed-dim": "#ffb2b7",
                        "secondary": "#4edea3",
                        "on-surface": "#e5e2e1",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",

                    "spacing": {
                        "xs": "4px",
                        "lg": "24px",
                        "margin-mobile": "16px",
                        "unit": "4px",
                        "gutter": "16px",
                        "sm": "8px",
                        "margin-desktop": "32px",
                        "md": "16px",
                        "xl": "40px"
                    },
                    "fontFamily": {
                        "title-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-caps": ["JetBrains Mono"],
                        "body-sm": ["Inter"],

                    "fontSize": {

                }
            }
        }

<style>
        .glass-panel {
            backdrop-filter: blur(20px);
            background-color: rgba(255, 255, 255, 0.1);
        }
        .shimmer {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-sm pb-16">
<!-- TopAppBar (Mobile) / SideNav (Desktop) Semantic Shell Navigation -->
<header class="w-full top-0 sticky border-b border-outline-variant bg-background dark:bg-background text-primary dark:text-primary font-headline-lg-mobile text-headline-lg-mobile z-40 hidden md:flex">
<!-- Desktop Nav Placeholder - Hidden on mobile -->
<div class="w-72 h-full flex flex-col py-lg bg-surface dark:bg-surface border-r border-outline-variant shadow-xl">
<div class="px-margin-mobile mb-lg">
<span class="font-display text-display text-primary">RESTAURANT OS</span>
</div>
<nav class="flex-1 px-sm">
<!-- Links -->
</nav>
</div>
</header>
<!-- TopAppBar for Mobile View -->
<header class="w-full top-0 sticky border-b border-outline-variant bg-background dark:bg-background text-primary dark:text-primary font-headline-lg-mobile text-headline-lg-mobile z-40 md:hidden flex justify-between items-center px-margin-mobile py-sm">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="restaurant">restaurant</span>
<span class="font-label-caps text-label-caps tracking-widest text-primary dark:text-primary uppercase">RESTAURANT OS</span>
</div>
<div>
<img class="w-8 h-8 rounded-full object-cover border border-outline-variant" data-alt="A small circular avatar portrait of a professional restaurant manager in a modern kitchen setting, lit with high contrast dramatic lighting, maintaining a sleek high-end aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBXoY9jCXCbUNRxTJuFSTixM4tYKWBIMmaqz8DH65pD9VAxUxxLOFegifyYsJdFyZHZ1LZMCjnXW6c1_wneoEp5PyBlWBeRJn8btK_fyBMB0HBk8ux25NBd8J1y24-5ML03Uc-hn6cDVY8rsIuTQ21KL_ye5vLg-lSd-bwn71f4OLYmso1-S7qVc4RtoXCdUwMkM96rdoKYiPSy5pEKFjdrWbpFXvAzuEEqx6oRTLnT_URZTLnVhcG90Q"/>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col p-margin-mobile gap-lg max-w-7xl mx-auto w-full mt-4 md:mt-0">
<!-- Live Operations / KPIs -->
<section class="grid grid-cols-2 md:grid-cols-4 gap-sm">
<div class="bg-surface-container-low border border-outline-variant rounded-DEFAULT p-md flex flex-col gap-2 relative">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Net Sales</span>
<span class="font-data-pos text-data-pos text-primary-fixed text-2xl">$12,450</span>
<div class="absolute top-2 right-2 w-2 h-2 rounded-full bg-secondary shimmer"></div>
</div>
<div class="bg-surface-container-low border border-outline-variant rounded-DEFAULT p-md flex flex-col gap-2 relative">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Guest Count</span>
<span class="font-data-pos text-data-pos text-on-surface text-2xl">214</span>
</div>
<div class="bg-surface-container-low border border-outline-variant rounded-DEFAULT p-md flex flex-col gap-2 relative">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Labor %</span>
<span class="font-data-pos text-data-pos text-error text-2xl">24.5%</span>
</div>
<div class="bg-surface-container-low border border-outline-variant rounded-DEFAULT p-md flex flex-col gap-2 relative">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Avg Ticket</span>
<span class="font-data-pos text-data-pos text-on-surface text-2xl">$58.17</span>
</div>
</section>
<!-- Alerts & Table Overview -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-lg">
<!-- Critical Alerts list -->
<section class="md:col-span-1 flex flex-col gap-sm">
<h2 class="font-title-md text-title-md text-on-surface mb-xs flex items-center gap-2">
<span class="material-symbols-outlined text-error" data-icon="warning">warning</span>
                    ALERTS
                </h2>
<div class="bg-error-container border border-error rounded-DEFAULT p-md flex items-start gap-sm">
<span class="material-symbols-outlined text-on-error mt-1" data-icon="timer">timer</span>
<div>
<p class="font-label-caps text-label-caps text-on-error uppercase font-bold">Long Wait: T12</p>
<p class="font-body-sm text-body-sm text-on-error opacity-90 mt-1">Appetizers pending &gt; 18 mins.</p>
</div>
</div>
<div class="bg-surface-container border border-outline-variant rounded-DEFAULT p-md flex items-start gap-sm">
<span class="material-symbols-outlined text-primary mt-1" data-icon="inventory">inventory</span>
<div>
<p class="font-label-caps text-label-caps text-on-surface uppercase font-bold">Low Stock</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Truffle oil depleted. Auto-86 active.</p>
</div>
</div>
<div class="mt-4 flex gap-2">
<button class="flex-1 bg-surface-container-high border border-outline-variant text-on-surface font-label-caps text-label-caps py-2 rounded-DEFAULT flex items-center justify-center gap-2 active:bg-surface-container-highest">
<span class="material-symbols-outlined text-sm" data-icon="chat">chat</span> MESSAGE STAFF
                    </button>
</div>
</section>
<!-- Table Status Map -->
<section class="md:col-span-2 flex flex-col gap-sm">
<h2 class="font-title-md text-title-md text-on-surface mb-xs flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" data-icon="grid_view">grid_view</span>
                    FLOOR PLAN
                </h2>
<div class="bg-surface-container-low border border-outline-variant rounded-lg p-md h-64 md:h-full relative overflow-hidden flex items-center justify-center">
<!-- Decorative floorplan grid background -->
<div class="absolute inset-0 opacity-10" style="background-size: 20px 20px; background-image: linear-gradient(to right, #4d4635 1px, transparent 1px), linear-gradient(to bottom, #4d4635 1px, transparent 1px);"></div>
<!-- Table Nodes -->
<div class="absolute top-[20%] left-[20%] w-12 h-12 border border-[#262626] rounded-full flex items-center justify-center bg-[#2a2a2a] text-[#f2ca50] font-data-pos text-xs">
                        T1
                   </div>
<div class="absolute top-[20%] left-[40%] w-12 h-12 border border-[#262626] rounded-full flex items-center justify-center bg-secondary-container text-white font-data-pos text-xs">
                        T2
                   </div>
<div class="absolute top-[50%] left-[30%] w-16 h-12 border border-[#262626] rounded-DEFAULT flex items-center justify-center bg-error-container text-on-error font-data-pos text-xs shimmer">
                        T12
                   </div>
<div class="absolute top-[70%] left-[60%] w-16 h-16 border border-[#262626] rounded-full flex items-center justify-center bg-[#131313] text-on-surface-variant font-data-pos text-xs">
                        T4
                   </div>
<div class="absolute bottom-4 right-4 flex gap-4 bg-surface px-4 py-2 rounded-DEFAULT border border-outline-variant">
<div class="flex items-center gap-1 font-label-caps text-[10px] text-on-surface-variant"><div class="w-2 h-2 rounded-full bg-secondary-container"></div> Ready</div>
<div class="flex items-center gap-1 font-label-caps text-[10px] text-on-surface-variant"><div class="w-2 h-2 rounded-full bg-error"></div> Overdue</div>
</div>
</div>
</section>
</div>
</main>
<!-- BottomNavBar (Mobile Shell) -->
<nav class="fixed bottom-0 w-full z-50 border-t border-outline-variant bg-surface-container-lowest flex justify-around items-center h-16 px-4 md:hidden">
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1">
<span class="material-symbols-outlined" data-icon="monitoring" style="font-variation-settings: 'FILL' 1;">monitoring</span>
<span class="font-label-caps text-label-caps mt-1 text-[10px]">Sales</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-70 hover:text-primary transition-all active:opacity-80">
<span class="material-symbols-outlined" data-icon="notifications_active">notifications_active</span>
<span class="font-label-caps text-label-caps mt-1 text-[10px]">Alerts</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-70 hover:text-primary transition-all active:opacity-80">
<span class="material-symbols-outlined" data-icon="groups">groups</span>
<span class="font-label-caps text-label-caps mt-1 text-[10px]">Staff</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-70 hover:text-primary transition-all active:opacity-80">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-caps text-label-caps mt-1 text-[10px]">Settings</span>
</button>
</nav>
</body></html>
