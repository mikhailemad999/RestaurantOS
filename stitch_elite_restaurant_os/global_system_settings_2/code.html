<script>
        function switchTab(tabId) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            // Show selected tab content
            document.getElementById(tabId).classList.add('active');
            
            // Update tab button styles
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-surface-container-high', 'text-primary', 'border-primary');
                btn.classList.add('text-on-surface-variant', 'border-transparent');
                
                // Add hover class back to inactive tabs
                if(!btn.classList.contains('hover:bg-surface-container')) {
                     btn.classList.add('hover:bg-surface-container');
                }
            });
            
            // Set active style for clicked button
            const activeBtn = event.currentTarget;
            activeBtn.classList.remove('text-on-surface-variant', 'border-transparent', 'hover:bg-surface-container');
            activeBtn.classList.add('bg-surface-container-high', 'text-primary', 'border-primary');
        }
    </script>
