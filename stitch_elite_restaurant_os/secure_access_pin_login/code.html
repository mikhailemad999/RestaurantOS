        body { background-color: theme('colors.background'); color: theme('colors.on-background'); }

<body class="h-screen w-full flex items-center justify-center bg-background overflow-hidden relative">
<!-- Ambient background image for texture -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none" data-alt="A dark, moody, slightly blurred background image of a high-end restaurant interior at night, featuring subtle reflections on stainless steel kitchen surfaces and warm, dim, ambient golden lighting. The focus is soft, creating an atmospheric, cinematic backdrop suitable for a premium dark-mode interface. The image should convey quiet luxury and operational efficiency." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBacPmGXJfQDHXnvVgffv7fFYrt7Ei8sPp07SAlaxK_WHedgjCazTOje5SCDVTW38_pxHIqqaXVOSKvDyBQn_tovX2SQGcybGUb5dVHR4Q1hpS6ZN0AtP0vWBMgMG7uCmT6JNgPv6H679dV436Bj7VHmkMxWcRgr194FdVUjNcaolivIzuPCmCVyg_f11TLSnTEpgOfYJU1_76DASxm60XpbiZAdimEbPX-LOyYzWs36-vqEuNiUEFoPQ')"></div>
<div class="absolute inset-0 z-0 bg-gradient-to-t from-background via-transparent to-background opacity-80 pointer-events-none"></div>
<div class="relative z-10 w-full max-w-6xl px-margin-mobile md:px-margin-desktop flex flex-col md:flex-row items-center justify-center gap-xl h-full">
<!-- Left Column: Branding & Manager Login (hidden on very small screens, stacked on small, side-by-side on lg) -->
<div class="flex-1 flex flex-col justify-center items-start space-y-lg max-w-md w-full">
<!-- Brand -->
<div class="flex items-center space-x-sm mb-lg">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">restaurant</span>
<div>
<h1 class="font-display text-display text-on-background m-0 p-0 leading-none tracking-tight">Restaurant<span class="text-primary">OS</span></h1>
<p class="font-label-caps text-label-caps text-on-surface-variant mt-sm">ENTERPRISE MANAGEMENT SYSTEM</p>
</div>
</div>
<!-- Management Login Form -->
<div class="w-full bg-surface-container-low rounded-xl p-lg card-border relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-50"></div>
<h2 class="font-title-md text-title-md text-on-background mb-lg flex items-center gap-sm">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">admin_panel_settings</span>
                    Manager Access
                </h2>
<form class="space-y-md">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs">EMAIL / ID</label>
<div class="input-border rounded bg-surface-container-highest px-md py-sm flex items-center transition-colors">
<span class="material-symbols-outlined text-on-surface-variant mr-sm">mail</span>
<input class="w-full bg-transparent border-none focus:ring-0 text-on-background font-body-lg text-body-lg placeholder-on-surface-variant/50 p-0" placeholder="admin@restaurant.os" type="email"/>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-caps text-label-caps text-on-surface-variant">PASSWORD</label>
<a class="font-label-caps text-label-caps text-primary hover:text-primary-fixed transition-colors" href="#">FORGOT?</a>
</div>
<div class="input-border rounded bg-surface-container-highest px-md py-sm flex items-center transition-colors">
<span class="material-symbols-outlined text-on-surface-variant mr-sm">lock</span>
<input class="w-full bg-transparent border-none focus:ring-0 text-on-background font-body-lg text-body-lg placeholder-on-surface-variant/50 p-0" placeholder="••••••••" type="password"/>
<button class="text-on-surface-variant hover:text-on-background transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-label-caps text-label-caps py-md rounded hover:bg-primary-fixed transition-colors mt-lg flex justify-center items-center gap-sm" type="button">
                        SECURE LOGIN <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</form>
</div>
</div>
<!-- Divider (visible only on desktop) -->
<div class="hidden md:block w-[1px] h-96 bg-outline-variant opacity-50"></div>

<div class="flex-1 flex flex-col justify-center items-center w-full max-w-md">
<div class="w-full bg-surface-container-lowest rounded-xl p-lg card-border relative shadow-2xl">

<div class="absolute inset-0 bg-primary-container opacity-5 blur-3xl pointer-events-none rounded-xl"></div>
<div class="relative z-10 flex flex-col items-center">
<h2 class="font-headline-lg text-headline-lg text-on-background mb-sm text-center">POS Terminal</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-xl text-center">Enter 4-digit Server PIN</p>
<!-- PIN Display -->
<div class="flex justify-center gap-md mb-xl">
<div class="w-4 h-4 rounded-full bg-primary"></div>
<div class="w-4 h-4 rounded-full bg-primary"></div>
<div class="w-4 h-4 rounded-full bg-surface-container-highest border border-outline-variant"></div>
<div class="w-4 h-4 rounded-full bg-surface-container-highest border border-outline-variant"></div>
</div>
<!-- Numpad Grid -->
<div class="grid grid-cols-3 gap-sm w-full max-w-[280px]">
<!-- Row 1 -->
<button class="bg-surface-container-high hover:bg-surface-variant text-on-background font-data-pos text-display py-md rounded-lg card-border transition-all hover:border-primary-container active:bg-primary active:text-on-primary">1</button>
<button class="bg-surface-container-high hover:bg-surface-variant text-on-background font-data-pos text-display py-md rounded-lg card-border transition-all hover:border-primary-container active:bg-primary active:text-on-primary">2</button>
<button class="bg-surface-container-high hover:bg-surface-variant text-on-background font-data-pos text-display py-md rounded-lg card-border transition-all hover:border-primary-container active:bg-primary active:text-on-primary">3</button>
<!-- Row 2 -->
<button class="bg-surface-container-high hover:bg-surface-variant text-on-background font-data-pos text-display py-md rounded-lg card-border transition-all hover:border-primary-container active:bg-primary active:text-on-primary">4</button>
<button class="bg-surface-container-high hover:bg-surface-variant text-on-background font-data-pos text-display py-md rounded-lg card-border transition-all hover:border-primary-container active:bg-primary active:text-on-primary">5</button>
<button class="bg-surface-container-high hover:bg-surface-variant text-on-background font-data-pos text-display py-md rounded-lg card-border transition-all hover:border-primary-container active:bg-primary active:text-on-primary">6</button>
<!-- Row 3 -->
<button class="bg-surface-container-high hover:bg-surface-variant text-on-background font-data-pos text-display py-md rounded-lg card-border transition-all hover:border-primary-container active:bg-primary active:text-on-primary">7</button>
<button class="bg-surface-container-high hover:bg-surface-variant text-on-background font-data-pos text-display py-md rounded-lg card-border transition-all hover:border-primary-container active:bg-primary active:text-on-primary">8</button>
<button class="bg-surface-container-high hover:bg-surface-variant text-on-background font-data-pos text-display py-md rounded-lg card-border transition-all hover:border-primary-container active:bg-primary active:text-on-primary">9</button>
<!-- Row 4 -->
<button class="bg-surface-container-high hover:bg-error-container hover:text-on-error-container text-on-surface-variant font-data-pos text-title-md py-md rounded-lg card-border transition-all flex items-center justify-center">
<span class="material-symbols-outlined">backspace</span>
</button>
<button class="bg-surface-container-high hover:bg-surface-variant text-on-background font-data-pos text-display py-md rounded-lg card-border transition-all hover:border-primary-container active:bg-primary active:text-on-primary">0</button>
<button class="bg-primary-container hover:bg-primary text-on-primary-container font-data-pos text-title-md py-md rounded-lg transition-all flex items-center justify-center shadow-[0_0_15px_rgba(212,175,55,0.3)]">
<span class="material-symbols-outlined text-[32px]">check</span>
</button>
</div>
<div class="mt-lg flex items-center gap-xs">
<span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
<span class="font-label-caps text-label-caps text-secondary">SYSTEM ONLINE</span>
</div>
</div>
</div>
</div>
</div>
