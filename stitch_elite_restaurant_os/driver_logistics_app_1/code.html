<style>
        .swipe-container {
            position: relative;
            width: 100%;
            height: 56px;
            background-color: #2a2a2a; /* surface-container-high */
            border: 1px solid #4d4635; /* outline-variant */
            border-radius: 0.125rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .swipe-text {
            color: #e5e2e1; /* on-surface */
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
            pointer-events: none;
        }

        .swipe-button {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 56px;
            background-color: #f2ca50; /* primary */
            border-radius: 0.125rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;
            transition: transform 0.1s;
        }

        .swipe-button span {
            color: #3c2f00; /* on-primary */
        }
        
        .swipe-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0;
            background-color: #f2ca50; /* primary */
            opacity: 0.2;
            z-index: 1;
        }
        
        .checkbox-custom {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 1px solid #99907c; /* outline */
            border-radius: 0.125rem;
            background-color: transparent;
            display: grid;
            place-content: center;
            cursor: pointer;
        }

        .checkbox-custom::before {
            content: "";
            width: 12px;
            height: 12px;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #f2ca50; /* primary */
            background-color: #f2ca50;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .checkbox-custom:checked::before {
            transform: scale(1);
        }
        
        .checkbox-custom:checked {
            border-color: #f2ca50; /* primary */
        }
    </style>

<script>
        // Simple Swipe to Complete Logic
        const swipeButton = document.getElementById('swipeButton');
        const swipeContainer = document.getElementById('swipeContainer');
        const swipeFill = document.getElementById('swipeFill');
        const swipeText = document.getElementById('swipeText');
        
        let isDragging = false;
        let startX = 0;
        let currentX = 0;
        
        const containerWidth = swipeContainer.offsetWidth;
        const buttonWidth = swipeButton.offsetWidth;
        const maxDrag = containerWidth - buttonWidth;

        function updatePosition(x) {
            let boundedX = Math.max(0, Math.min(x, maxDrag));
            swipeButton.style.transform = `translateX(${boundedX}px)`;
            swipeFill.style.width = `${boundedX + buttonWidth/2}px`;
            
            // Fade text as button moves
            const progress = boundedX / maxDrag;
            swipeText.style.opacity = 1 - progress;

            if (boundedX === maxDrag) {
                completeAction();
            }
        }

        function completeAction() {
            swipeButton.style.backgroundColor = '#00a572'; // secondary-container for success
            swipeButton.innerHTML = '<span class="material-symbols-outlined" style="color: #00311f">check</span>';
            swipeText.textContent = 'Delivery Completed';
            swipeText.style.opacity = 1;
            swipeText.style.color = '#00a572';
            
            // Disable further dragging
            isDragging = false;
            swipeButton.style.cursor = 'default';
            swipeButton.removeEventListener('mousedown', startDrag);
            swipeButton.removeEventListener('touchstart', startDrag);
        }

        function startDrag(e) {
            isDragging = true;
            startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            swipeButton.style.transition = 'none';
        }

        function doDrag(e) {
            if (!isDragging) return;
            e.preventDefault(); // Prevent scrolling on touch
            const x = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            currentX = x - startX;
            updatePosition(currentX);
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            swipeButton.style.transition = 'transform 0.3s ease-out';
            
            // If not fully swiped, snap back
            const transform = swipeButton.style.transform;
            const currentTranslateX = parseInt(transform.replace('translateX(', '').replace('px)', '')) || 0;
            
            if (currentTranslateX < maxDrag * 0.9) {
                swipeButton.style.transform = `translateX(0px)`;
                swipeFill.style.width = '0px';
                swipeText.style.opacity = 1;
            }
        }

        swipeButton.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', doDrag);
        document.addEventListener('mouseup', endDrag);

        swipeButton.addEventListener('touchstart', startDrag);
        document.addEventListener('touchmove', doDrag, { passive: false });
        document.addEventListener('touchend', endDrag);
        
        // Handle window resize
        window.addEventListener('resize', () => {
             // Reset state on resize for simplicity in this demo
            if(swipeText.textContent !== 'Delivery Completed') {
                swipeButton.style.transform = `translateX(0px)`;
                swipeFill.style.width = '0px';
                swipeText.style.opacity = 1;
            }
        });
    </script>
