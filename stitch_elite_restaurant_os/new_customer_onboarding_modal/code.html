<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RestaurantOS - New Customer &amp; Address Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#d4af37",
                        "outline-variant": "#4d4635",
                        "inverse-surface": "#e5e2e1",
                        "outline": "#99907c",
                        "tertiary": "#ffbec1",
                        "on-primary-fixed": "#241a00",
                        "surface-container-low": "#1c1b1b",
                        "surface-container-high": "#2a2a2a",
                        "surface-tint": "#e9c349",
                        "secondary-fixed": "#6ffbbe",
                        "tertiary-container": "#ff949c",
                        "secondary-container": "#00a572",
                        "on-background": "#e5e2e1",
                        "primary-fixed": "#ffe088",
                        "on-secondary": "#003824",
                        "surface-variant": "#353535",
                        "surface": "#131313",
                        "primary": "#f2ca50",
                        "error": "#ffb4ab",
                        "tertiary-fixed-dim": "#ffb2b7",
                        "on-primary-fixed-variant": "#574500",
                        "secondary": "#4edea3",
                        "surface-container": "#20201f",
                        "tertiary-fixed": "#ffdadb",
                        "background": "#131313",
                        "primary-fixed-dim": "#e9c349",
                        "surface-bright": "#393939",
                        "on-tertiary": "#67001b",
                        "on-tertiary-container": "#8e0029",
                        "inverse-primary": "#735c00",
                        "surface-container-highest": "#353535",
                        "surface-dim": "#131313",
                        "error-container": "#93000a",
                        "on-surface-variant": "#d0c5af",
                        "on-tertiary-fixed": "#40000d",
                        "on-primary-container": "#554300",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#92002a",
                        "on-secondary-fixed-variant": "#005236",
                        "on-secondary-container": "#00311f",
                        "secondary-fixed-dim": "#4edea3",
                        "surface-container-lowest": "#0e0e0e",
                        "on-error": "#690005",
                        "on-primary": "#3c2f00",
                        "inverse-on-surface": "#313030",
                        "on-surface": "#e5e2e1",
                        "on-secondary-fixed": "#002113"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "32px",
                        "sm": "8px",
                        "margin-mobile": "16px",
                        "xl": "40px",
                        "md": "16px",
                        "unit": "4px",
                        "gutter": "16px",
                        "lg": "24px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "data-pos": ["JetBrains Mono"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-sm": ["Inter"],
                        "title-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-caps": ["JetBrains Mono"],
                        "display": ["Inter"]
                    },
                    "fontSize": {
                        "data-pos": ["18px", { "lineHeight": "1.0", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "title-md": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                },
            },
        }
    </script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Input Styles for High-Contrast Modern POS */
        .pos-input {
            @apply w-full bg-surface-container-lowest text-on-surface border border-outline-variant rounded px-md py-sm font-body-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors;
        }
        .pos-label {
            @apply block text-on-surface-variant font-label-caps text-label-caps mb-xs;
        }
        
        /* Modal Backdrop Blur Override to maintain dark aesthetic */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-lg h-screen w-screen overflow-hidden antialiased">
<!-- Mock Background Interface (Dimmed Context) -->
<div class="fixed inset-0 grid grid-cols-12 gap-unit p-unit bg-surface blur-sm opacity-50 z-0">
<!-- Sidebar Mock -->
<div class="col-span-2 bg-surface-container-lowest border-r border-outline-variant h-full p-md">
<div class="h-12 bg-surface-variant rounded mb-lg"></div>
<div class="space-y-md">
<div class="h-8 bg-surface-variant rounded w-3/4"></div>
<div class="h-8 bg-surface-variant rounded w-5/6"></div>
<div class="h-8 bg-surface-variant rounded w-2/3"></div>
</div>
</div>
<!-- Main Content Mock -->
<div class="col-span-7 bg-surface-container h-full p-md">
<div class="grid grid-cols-3 gap-md">
<div class="h-32 bg-surface-variant border border-outline-variant rounded"></div>
<div class="h-32 bg-surface-variant border border-outline-variant rounded"></div>
<div class="h-32 bg-surface-variant border border-outline-variant rounded"></div>
<div class="h-32 bg-surface-variant border border-outline-variant rounded"></div>
<div class="h-32 bg-surface-variant border border-outline-variant rounded"></div>
</div>
</div>
<!-- Ticket Mock -->
<div class="col-span-3 bg-surface-container-low border-l border-outline-variant h-full p-md flex flex-col">
<div class="h-16 bg-surface-variant rounded mb-md w-full"></div>
<div class="flex-grow bg-surface-container-lowest border border-outline-variant rounded p-sm">
<div class="h-10 border-b border-outline-variant mb-sm"></div>
<div class="h-10 border-b border-outline-variant mb-sm"></div>
</div>
<div class="h-24 bg-primary-container rounded mt-md w-full"></div>
</div>
</div>
<!-- Modal Overlay Container -->
<div class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-margin-desktop md:p-xl">
<!-- Modal Card -->
<div class="bg-surface border border-outline-variant rounded-lg shadow-2xl w-full max-w-4xl flex flex-col max-h-full overflow-hidden" style="box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);">
<!-- Modal Header -->
<div class="flex justify-between items-center px-lg py-md border-b border-outline-variant bg-surface-container">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="person_add">person_add</span>
<div>
<h2 class="font-title-md text-title-md text-on-surface m-0 leading-none">New Customer</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Enter details for new delivery profile</p>
</div>
</div>
<button class="text-on-surface-variant hover:text-primary transition-colors p-unit rounded active:bg-surface-variant">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Modal Body (Scrollable) -->
<div class="flex-grow overflow-y-auto p-lg bg-surface custom-scrollbar">
<form class="space-y-xl">
<!-- Customer Information Section -->
<section>
<h3 class="font-label-caps text-label-caps text-primary border-b border-outline-variant pb-xs mb-md flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]" data-icon="contact_page">contact_page</span>
                            Customer Details
                        </h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Primary Phone (Pre-filled style) -->
<div class="col-span-1">
<label class="pos-label" for="phone-primary">Primary Phone (Searched)</label>
<div class="relative">
<span class="absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant material-symbols-outlined text-[20px]" data-icon="call">call</span>
<input class="pos-input pl-10 border-primary bg-surface-container text-primary font-data-pos text-data-pos" id="phone-primary" readonly="" type="tel" value="+1 (555) 019-8273"/>
</div>
</div>
<!-- Full Name -->
<div class="col-span-1">
<label class="pos-label" for="full-name">Full Name <span class="text-error">*</span></label>
<input autofocus="" class="pos-input" id="full-name" placeholder="e.g. Jane Doe" required="" type="text"/>
</div>
<!-- Secondary Phone -->
<div class="col-span-1">
<label class="pos-label" for="phone-secondary">Secondary Phone</label>
<input class="pos-input font-data-pos text-data-pos" id="phone-secondary" placeholder="Optional" type="tel"/>
</div>
<!-- Email -->
<div class="col-span-1">
<label class="pos-label" for="email">Email Address</label>
<input class="pos-input" id="email" placeholder="customer@example.com" type="email"/>
</div>
</div>
</section>
<!-- Delivery Address Section -->
<section>
<h3 class="font-label-caps text-label-caps text-primary border-b border-outline-variant pb-xs mb-md flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]" data-icon="location_on">location_on</span>
                            Delivery Address
                        </h3>
<div class="grid grid-cols-1 md:grid-cols-12 gap-md">
<!-- Area/Zone -->
<div class="md:col-span-4">
<label class="pos-label" for="delivery-area">Delivery Area <span class="text-error">*</span></label>
<select class="pos-input appearance-none bg-surface-container-lowest" id="delivery-area" required="">
<option disabled="" selected="" value="">Select Area...</option>
<option value="downtown">Downtown Core</option>
<option value="northside">Northside District</option>
<option value="westend">West End</option>
<option value="eastvillage">East Village</option>
</select>
</div>
<!-- Street Name -->
<div class="md:col-span-8">
<label class="pos-label" for="street-name">Street Name <span class="text-error">*</span></label>
<input class="pos-input" id="street-name" placeholder="e.g. Main Street" required="" type="text"/>
</div>
<!-- Building Number -->
<div class="md:col-span-4">
<label class="pos-label" for="building-num">Building / House No. <span class="text-error">*</span></label>
<input class="pos-input font-data-pos text-data-pos" id="building-num" placeholder="e.g. 14B" required="" type="text"/>
</div>
<!-- Floor/Apt -->
<div class="md:col-span-4">
<label class="pos-label" for="floor-apt">Floor / Apt No.</label>
<input class="pos-input font-data-pos text-data-pos" id="floor-apt" placeholder="e.g. Apt 402" type="text"/>
</div>
<!-- Landmark -->
<div class="md:col-span-4">
<label class="pos-label" for="landmark">Landmark</label>
<input class="pos-input" id="landmark" placeholder="e.g. Near Central Park" type="text"/>
</div>
</div>
</section>
<!-- Notes Section -->
<section>
<h3 class="font-label-caps text-label-caps text-on-surface-variant border-b border-outline-variant pb-xs mb-md flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]" data-icon="note_alt">note_alt</span>
                            Instructions &amp; Notes
                        </h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Delivery Notes -->
<div class="col-span-1">
<label class="pos-label" for="delivery-notes">Driver Instructions</label>
<textarea class="pos-input resize-none" id="delivery-notes" placeholder="e.g. Call upon arrival, leave at reception..." rows="3"></textarea>
</div>
<!-- Customer Notes (Internal) -->
<div class="col-span-1">
<label class="pos-label" for="customer-notes">Kitchen/Internal Notes</label>
<textarea class="pos-input resize-none" id="customer-notes" placeholder="e.g. Allergy preferences, VIP status..." rows="3"></textarea>
</div>
</div>
</section>
</form>
</div>
<!-- Modal Footer / Actions -->
<div class="px-lg py-md border-t border-outline-variant bg-surface-container flex justify-end gap-md">
<button class="px-lg py-sm rounded border border-outline-variant text-on-surface font-title-md text-title-md hover:bg-surface-variant transition-colors active:opacity-80" type="button">
                    Cancel
                </button>
<button class="px-lg py-sm rounded bg-primary text-on-primary font-title-md text-title-md flex items-center gap-sm hover:bg-primary-fixed transition-colors shadow-[inset_0_0_20px_rgba(255,255,255,0.1)] active:opacity-80" type="button">
<span class="material-symbols-outlined" data-icon="save">save</span>
                    Save &amp; Start Order
                </button>
</div>
</div>
</div>
</body></html>
